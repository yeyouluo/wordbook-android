# 依赖与 Actions 的自动更新检查
#
# 策略说明（个人自用项目 + 工具链刻意锁定）：
# - Gradle 依赖**只接受补丁级更新**（如 2.6.1 → 2.6.2）。AndroidX / Compose 的小版本升级
#   经常要求同步抬高 compileSdk 与 AGP/Kotlin，属于"要整套协调"的事，
#   不适合由机器人开 PR 自动合并，所以 minor/major 一律忽略，需要时手动升级。
# - GitHub Actions 用月度检查（它的版本升级基本无痛）。
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # 只放行补丁号更新；小版本/大版本需要人工评估工具链兼容性
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      gradle-patches:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
