name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # GitHub 的 ubuntu runner 已预装 Android SDK（ANDROID_HOME 已导出、许可已接受），
      # 因此不需要 android-actions/setup-android（它会在部分 runner 上安装失败）。
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" | head

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: WordBook-debug-apk
          path: dist/*.apk
          if-no-files-found: warn

      # 用仓库自带的 GITHUB_TOKEN（本地不需要任何凭据）：
      # 1) 该版本还没有 Release 就先创建一个（notes 指向 CHANGELOG）
      # 2) 把 debug 包挂上去（只传 *-debug.apk，绝不覆盖本地签名的正式包）
      - name: Ensure release and attach debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="v${VERSION}"
          echo "app version: $VERSION → tag: $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "WordBook ${TAG}" \
              --notes "变更见 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)。

  正式包（已签名、体积更小）由本地签名后上传；本 Release 的 debug 包可直接安装使用。" || true
            echo "已创建 Release $TAG"
          fi
          gh release upload "$TAG" dist/*-debug.apk --clobber || true
          echo "已挂载 debug 包到 $TAG"
