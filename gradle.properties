# JVM 内存配置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Android X 必须开启
android.useAndroidX=true
# 只生成用到的 BuildConfig 字段，加速构建
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
# 仓库下载超时（公司网络较慢，~400KB/s，需要等大文件）
systemProp.org.gradle.internal.http.socket.timeout=900000
systemProp.org.gradle.internal.http.connection.timeout=900000
